services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # opcionais — só necessários pro endpoint /predict/explain (LLM). O /predict
      # continua funcionando normalmente sem eles. LLM_PROVIDER escolhe entre
      # "groq" (default, gratuito) e "openai" — ver .env.example.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
